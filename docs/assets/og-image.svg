<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="glowGreen" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="rgba(0, 166, 81, 0.28)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 114, 198, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A651" />
      <stop offset="55%" stop-color="#008F75" />
      <stop offset="100%" stop-color="#0072C6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowGreen)" />
  <rect width="1200" height="630" fill="url(#glowBlue)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- LEFT CONTENT -->
  <g transform="translate(80, 90)">
    <!-- Brand Logo Mark -->
    <g transform="translate(0, 0)">
      <rect width="64" height="64" rx="16" fill="url(#logoGrad)" />
      <path d="M 44 20 C 44 13, 22 13, 22 24 C 22 32, 42 30, 42 41 C 42 52, 21 52, 21 44" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- Wordmark -->
    <text x="82" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1px">
      <tspan fill="#38BDF8">Salone</tspan><tspan fill="#00E676">UI</tspan>
    </text>

    <!-- Version Pill -->
    <rect x="330" y="20" width="76" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5" />
    <text x="368" y="39" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">v1.1.1</text>

    <!-- Main Headline -->
    <text x="0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" line-height="1.2">
      <tspan x="0" dy="0">Build Beautiful Websites</tspan>
      <tspan x="0" dy="64" fill="url(#logoGrad)">With Plain English.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      <tspan x="0" dy="0">Zero abbreviations. Zero build tools. Under 25KB.</tspan>
      <tspan x="0" dy="32">Smart plain words like button green, card, and grid 3.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="130" height="38" rx="19" fill="#131C31" stroke="#23314E" stroke-width="1" />
      <text x="65" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">⚡ &lt;25KB CSS</text>

      <rect x="145" y="0" width="155" height="38" rx="19" fill="#131C31" stroke="#23314E" stroke-width="1" />
      <text x="222" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle">🎯 26 Components</text>

      <rect x="315" y="0" width="135" height="38" rx="19" fill="#131C31" stroke="#23314E" stroke-width="1" />
      <text x="382" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">🎨 1-Word Themes</text>

      <rect x="465" y="0" width="125" height="38" rx="19" fill="#131C31" stroke="#23314E" stroke-width="1" />
      <text x="527" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#EC4899" text-anchor="middle">🤖 AI-Native</text>
    </g>
  </g>

  <!-- RIGHT CARD SHOWCASE -->
  <g transform="translate(730, 95)">
    <!-- Realistic Financial Money Card -->
    <g filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))">
      <rect width="390" height="245" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      
      <!-- Top Row -->
      <text x="28" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="1px">SALONEBANK</text>
      <circle cx="342" cy="38" r="14" fill="rgba(239, 68, 68, 0.85)" />
      <circle cx="358" cy="38" r="14" fill="rgba(245, 158, 11, 0.85)" />

      <!-- Chip -->
      <rect x="28" y="70" width="46" height="34" rx="6" fill="url(#chipGrad)" stroke="#B45309" stroke-width="1" />
      <line x1="28" y1="87" x2="74" y2="87" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
      <rect x="34" y="75" width="34" height="24" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1" />

      <!-- Contactless waves -->
      <path d="M 90 77 A 10 10 0 0 1 90 97 M 96 72 A 16 16 0 0 1 96 102 M 102 67 A 22 22 0 0 1 102 107" 
            fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" />

      <!-- Number -->
      <text x="28" y="145" font-family="ui-monospace, monospace" font-size="21" font-weight="700" fill="#FFFFFF" letter-spacing="3px">4532 •••• •••• 9821</text>

      <!-- Bottom Row -->
      <text x="28" y="185" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1px">CARDHOLDER</text>
      <text x="28" y="206" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1px">ALEXANDER WRIGHT</text>

      <text x="280" y="185" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1px">EXPIRES</text>
      <text x="280" y="206" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1px">08/29</text>
    </g>

    <!-- Code Snippet Card Below -->
    <g transform="translate(0, 275)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))">
      <rect width="390" height="175" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="24" cy="22" r="5" fill="#EF4444" />
      <circle cx="38" cy="22" r="5" fill="#F59E0B" />
      <circle cx="52" cy="22" r="5" fill="#10B981" />
      <text x="366" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#64748B" text-anchor="end">index.html</text>

      <text x="20" y="60" font-family="ui-monospace, monospace" font-size="13" fill="#E2E8F0">
        <tspan fill="#64748B">&lt;!-- Plain English Classes --&gt;</tspan>
      </text>
      <text x="20" y="85" font-family="ui-monospace, monospace" font-size="13" fill="#E2E8F0">
        <tspan fill="#38BDF8">&lt;div</tspan> <tspan fill="#F59E0B">class=</tspan><tspan fill="#10B981">"money-card"</tspan><tspan fill="#38BDF8">&gt;</tspan>
      </text>
      <text x="20" y="110" font-family="ui-monospace, monospace" font-size="13" fill="#E2E8F0">
        <tspan fill="#38BDF8">  &lt;div</tspan> <tspan fill="#F59E0B">class=</tspan><tspan fill="#10B981">"card-chip"</tspan><tspan fill="#38BDF8">&gt;&lt;/div&gt;</tspan>
      </text>
      <text x="20" y="135" font-family="ui-monospace, monospace" font-size="13" fill="#E2E8F0">
        <tspan fill="#38BDF8">  &lt;button</tspan> <tspan fill="#F59E0B">class=</tspan><tspan fill="#10B981">"button green"</tspan><tspan fill="#38BDF8">&gt;</tspan>Send<tspan fill="#38BDF8">&lt;/button&gt;</tspan>
      </text>
      <text x="20" y="160" font-family="ui-monospace, monospace" font-size="13" fill="#38BDF8">&lt;/div&gt;</text>
    </g>
  </g>
</svg>
