# CodeRabbit Configuration for SaloneUI
# Free for public open-source repositories on GitHub
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

chat:
  auto_reply: true

knowledge_base:
  opt_out: false

instructions: |
  You are reviewing contributions for SaloneUI, an ultra-lightweight (<25KB) CSS framework.
  STRICT ARCHITECTURAL RULES:
  1. Plain-English classes ONLY (e.g. `button green`, `card elevated`, `grid 3`, `money-card`, `navbar`).
  2. DO NOT allow utility-first classes (e.g. `bg-`, `px-`, `py-`, `flex`, `grid-cols-`, `w-full`, `rounded-`).
  3. Strict ZERO EMOJI policy: Components and documentation must use clean vector SVGs, never unicode emojis.
  4. Core must remain pure CSS, HTML, and JS. Do NOT allow Rust, TypeScript, or build compiler dependencies.
  5. Flag any non-standard abbreviations and suggest the equivalent SaloneUI plain-English syntax.
