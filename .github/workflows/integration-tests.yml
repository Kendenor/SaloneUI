name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  component-and-link-tests:
    name: Framework & Documentation Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Create Test HTML & Verify Components
        run: |
          node -e '
          const fs = require("fs");
          const css = fs.readFileSync("dist/salone-ui.css", "utf8");

          // Test HTML markup utilizing core SaloneUI classes
          const testHtml = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>SaloneUI Integration Test</title>
            <link rel="stylesheet" href="dist/salone-ui.css">
          </head>
          <body>
            <nav class="navbar">
              <a href="#" class="nav-brand">Test</a>
            </nav>
            <div class="container">
              <div class="card elevated">
                <span class="badge green">Active</span>
                <h2>Integration Test Card</h2>
                <div class="grid 3">
                  <div class="card">Item 1</div>
                  <div class="card">Item 2</div>
                  <div class="card">Item 3</div>
                </div>
                <div class="money-card">
                  <span class="money-balance">SLE 10,000</span>
                </div>
                <button class="button green">Confirm</button>
                <button class="button outline">Cancel</button>
              </div>
            </div>
          </body>
          </html>`;

          fs.writeFileSync("test-integration.html", testHtml, "utf8");

          // Required core classes that must exist in salone-ui.css
          const requiredClasses = [
            ".button",
            ".button.green",
            ".card",
            ".card.elevated",
            ".grid",
            ".badge",
            ".navbar",
            ".money-card",
            ".alert",
            "dialog.notice"
          ];

          for (const cls of requiredClasses) {
            if (!css.includes(cls)) {
              console.error("Missing class in CSS:", cls);
              process.exit(1);
            }
          }
          console.log("Component rules verification passed.");
          '

      - name: Verify Documentation & Relative Links
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const docsFiles = [
            "README.md",
            "docs/index.html",
            "docs/docs.html",
            "docs/installation.html",
            "docs/components.html",
            "docs/icons.html"
          ];

          for (const doc of docsFiles) {
            if (!fs.existsSync(doc)) {
              console.error("Documentation file not found:", doc);
              process.exit(1);
            }
            const content = fs.readFileSync(doc, "utf8");

            // Check for unclosed tags or undefined asset references
            if (content.includes("src=\"undefined\"") || content.includes("href=\"undefined\"")) {
              console.error("Broken undefined reference detected in:", doc);
              process.exit(1);
            }
          }
          console.log("Documentation link & asset integrity verified.");
          '
