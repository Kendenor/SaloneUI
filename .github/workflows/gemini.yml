name: Gemini Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-assist:
    name: Gemini Assistant
    if: contains(github.event.comment.body, '@gemini')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for GEMINI_API_KEY
        id: check-key
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "Notice: GEMINI_API_KEY secret is not configured. Skipping step."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Inform Maintainer if Key is Missing
        if: steps.check-key.outputs.has_key == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = "ℹ️ **Gemini Assistant:** To enable automated Gemini responses, please add `GEMINI_API_KEY` under **Settings > Secrets and variables > Actions** in this repository.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Run Gemini Assistant
        if: steps.check-key.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body;
            console.log("Gemini triggered with query:", commentBody);
            const reply = "✨ **Gemini:** Analyzing SaloneUI request. Following rules: pure CSS, zero build step, plain-English classes (`button green`, `card elevated`, `grid 3`).";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reply
            });
