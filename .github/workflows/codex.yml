name: Codex / ChatGPT Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-assist:
    name: Codex Assistant
    if: contains(github.event.comment.body, '@codex')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check for OPENAI_API_KEY
        id: check-key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "Notice: OPENAI_API_KEY secret is not configured. Skipping step."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Inform Maintainer if Key is Missing
        if: steps.check-key.outputs.has_key == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const comment = "ℹ️ **Codex / ChatGPT Assistant:** To enable automated Codex responses, please add `OPENAI_API_KEY` under **Settings > Secrets and variables > Actions**.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Process with OpenAI Codex
        if: steps.check-key.outputs.has_key == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const commentBody = context.payload.comment.body;
            console.log("Codex triggered with query:", commentBody);
            // Process AI command using SaloneUI guidelines
            const reply = "🤖 **Codex:** SaloneUI guidelines are loaded. Plain-English classes are enforced (e.g. `button green`, `card elevated`). Ready to assist with component refinement.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reply
            });
