name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Build
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found, skipping build step."
          fi

      - name: Run Tests
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found, skipping test step."
          fi

      - name: Verify Core Framework Files Exist
        run: |
          echo "Verifying core distribution and documentation files..."
          required_files=(
            "src/salone-ui.css"
            "dist/salone-ui.css"
            "dist/salone-ui.min.css"
            "docs/index.html"
            "docs/docs.html"
            "docs/installation.html"
            "docs/components.html"
            "docs/icons.html"
            "package.json"
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing!"
              exit 1
            fi
            echo "Found: $file"
          done
          echo "All essential core files verified successfully."
