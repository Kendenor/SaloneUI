name: CodeRabbit PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Free for public open source repositories
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Review Credentials
        id: check_credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::notice ::CodeRabbit Action: OPENAI_API_KEY secret is not configured. For 100% free automatic AI reviews with zero API keys, install the CodeRabbit GitHub App (https://github.com/marketplace/coderabbitai), which reads .coderabbit.yaml automatically."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: CodeRabbit AI Code Review
        if: steps.check_credentials.outputs.has_key == 'true'
        uses: coderabbitai/ai-pr-reviewer@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
